      const MESAS_INICIAIS_DEMO = {
        1: [

          { id: 102, identificador: "Mesa 02 (Salão)", capacidade: 4, ativa: true },

        2: [

        ],
        3: [

        ],
        4: [
          { id: 401, identificador: "Tatame 01", capacidade: 2, ativa: true },
          { id: 402, identificador: "Tatame 02", capacidade: 4, ativa: true },
          { id: 403, identificador: "Lounge 03", capacidade: 6, ativa: true },
        ],
      };

      const HORARIOS_BASE = [
        { hora: "18:30", ocioso: true, bonus: "Horário VIP (+Desconto Garantido)" },
        { hora: "19:00", ocioso: true, bonus: "Horário VIP (+Desconto Garantido)" },
        { hora: "19:30", ocioso: true, bonus: "Último horário com cupom máximo" },
        { hora: "20:00", ocioso: false, bonus: "Alta procura (Sem cupom ocioso)" },
        { hora: "20:30", ocioso: false, bonus: "Alta procura (Sem cupom ocioso)" },
        { hora: "21:00", ocioso: false, bonus: "Horário normal" },
      ];

      const POSICOES_MAPA = [
        { top: "44%", left: "48%" },
        { top: "68%", left: "28%" },
        { top: "26%", left: "66%" },
        { top: "56%", left: "74%" },
      ];

      const SUGESTOES_IA = [
        "Italiano romântico para jantar hoje em Brusque",
        "Hambúrguer barato com amigos em Brusque",
        "Frutos do mar sofisticado na praia em Itajaí",
        "Comida alemã tradicional em família",
      ];

      function extrairParametrosFallback(texto) {
        const q = texto.toLowerCase();
        let cuisine = "variada";
        for (const [termo, valor] of [
          ["italian", "italiana"],
          ["massa", "italiana"],
          ["pizza", "pizzaria"],
          ["japon", "japonesa"],
          ["sushi", "japonesa"],
          ["alem", "alemã"],
          ["hamburg", "hamburgueria"],
          ["burger", "hamburgueria"],
          ["frutos do mar", "frutos do mar"],
          ["peixe", "frutos do mar"],
          ["churrasc", "churrascaria"],
        ]) {
          if (q.includes(termo)) {
            cuisine = valor;
            break;
          }
        }

        let price_level = 2;
        if (["barato", "econômico", "economico", "em conta"].some((w) => q.includes(w))) {
          price_level = 1;
        } else if (["sofisticado", "especial", "fino"].some((w) => q.includes(w))) {
          price_level = 3;
        } else if (["luxo", "caro", "alta gastronomia"].some((w) => q.includes(w))) {
          price_level = 4;
        }

        let vibe = "casual";
        for (const [termo, valor] of [
          ["romântic", "romântico"],
          ["romantic", "romântico"],
          ["casal", "romântico"],
          ["família", "família"],
          ["familia", "família"],
          ["amigos", "happy hour"],
          ["happy hour", "happy hour"],
          ["tranquil", "tranquilo"],
        ]) {
          if (q.includes(termo)) {
            vibe = valor;
            break;
          }
        }

        const location =
          q.includes("itajaí") ||
          q.includes("itajai") ||
          q.includes("praia") ||
          cuisine === "frutos do mar"
            ? "Itajaí"
            : "Brusque";

        return { cuisine, price_level, vibe, location };
      }

      function App() {
        const [abaPrincipal, setAbaPrincipal] = useState("explorar");
        const [usandoApiReal, setUsandoApiReal] = useState(false);

        const [restaurantes, setRestaurantes] = useState(() => {
          try {
            const salvos = localStorage.getItem(STORAGE_KEY_RESTAURANTES);
            return salvos ? JSON.parse(salvos) : RESTAURANTES_INICIAIS;
          } catch {
            return RESTAURANTES_INICIAIS;
          }
        });
        const [categoriaAtiva, setCategoriaAtiva] = useState("Todos");
        const [busca, setBusca] = useState("");
        const [restauranteFocadoMapa, setRestauranteFocadoMapa] = useState(null);

        // Estados da Busca com IA
        const [carregandoIA, setCarregandoIA] = useState(false);
        const [resultadoIA, setResultadoIA] = useState(null);
        const cacheMemoriaLocalRef = useRef({});

        const [minhasReservas, setMinhasReservas] = useState(() => {
          try {
            const salvas = localStorage.getItem(STORAGE_KEY_RESERVAS);
            return salvas ? JSON.parse(salvas) : [];
          } catch {
            return [];
          }
        });

        const [mesasDemo, setMesasDemo] = useState(() => {
          try {
            const salvas = localStorage.getItem(STORAGE_KEY_MESAS);
            return salvas ? JSON.parse(salvas) : MESAS_INICIAIS_DEMO;
          } catch {
            return MESAS_INICIAIS_DEMO;
          }
        });

        const [restauranteSelecionado, setRestauranteSelecionado] = useState(null);
        const [dataReserva, setDataReserva] = useState(
          new Date().toISOString().split("T")[0]
        );
        const [horarioReserva, setHorarioReserva] = useState("19:00");
        const [qtdPessoas, setQtdPessoas] = useState(2);
        const [slotsDisponibilidade, setSlotsDisponibilidade] = useState([]);
        const [carregandoSlots, setCarregandoSlots] = useState(false);

        const [nomeUsuario, setNomeUsuario] = useState("");
        const [emailUsuario, setEmailUsuario] = useState("");
        const [telefoneUsuario, setTelefoneUsuario] = useState("");
        const [carregandoReserva, setCarregandoReserva] = useState(false);
        const [erroReserva, setErroReserva] = useState(null);
        const [reservaConfirmada, setReservaConfirmada] = useState(null);

        const [voucherDetalhe, setVoucherDetalhe] = useState(null);
        const [buscaVoucherCliente, setBuscaVoucherCliente] = useState("");

        // Estados do Painel do Restaurante Parceiro
        const [restauranteParceiroId, setRestauranteParceiroId] = useState(1);
        const [dataFiltroPainel, setDataFiltroPainel] = useState(
          new Date().toISOString().split("T")[0]
        );
        const [reservasPainel, setReservasPainel] = useState([]);
        const [mesasPainel, setMesasPainel] = useState([]);
        const [codigoCheckinInput, setCodigoCheckinInput] = useState("");
        const [feedbackPainel, setFeedbackPainel] = useState(null);

        const [cupomTextoEdit, setCupomTextoEdit] = useState("");
        const [cupomDescontoEdit, setCupomDescontoEdit] = useState(20);
        const [novaMesaNome, setNovaMesaNome] = useState("");
        const [novaMesaCap, setNovaMesaCap] = useState(4);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY_RESERVAS, JSON.stringify(minhasReservas));
          } catch {}
        }, [minhasReservas]);

        useEffect(() => {
          if (!usandoApiReal) {
            try {
              localStorage.setItem(
                STORAGE_KEY_RESTAURANTES,
                JSON.stringify(restaurantes)
              );
            } catch {}
          }
        }, [restaurantes, usandoApiReal]);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY_MESAS, JSON.stringify(mesasDemo));
          } catch {}
        }, [mesasDemo]);

        const carregarRestaurantes = useCallback(async () => {
          try {
            const res = await fetch(`${API_BASE_URL}/restaurantes`);
            if (!res.ok) throw new Error("API offline");
            const dados = await res.json();
            const enriquecidos = dados.map((item, idx) => ({
              ...item,
              posMapa: POSICOES_MAPA[idx % POSICOES_MAPA.length],
            }));
            setRestaurantes(enriquecidos);
            setUsandoApiReal(true);
          } catch {
            setUsandoApiReal(false);
          }
        }, []);

        useEffect(() => {
          carregarRestaurantes();
        }, [carregarRestaurantes]);

        // Executa busca em linguagem natural com IA + Cache + Google Places
        const executarBuscaIA = async (e, textoForcado) => {
          if (e) e.preventDefault();
          const consulta = (textoForcado ?? busca).trim();
          if (!consulta) return;
          if (textoForcado) setBusca(textoForcado);

          setCarregandoIA(true);

          try {
            if (usandoApiReal) {
              const res = await fetch(`${API_BASE_URL}/api/search`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: consulta }),
              });
              if (res.ok) {
                const data = await res.json();
                setResultadoIA(data);
                return;
              }
            }

            await new Promise((r) => setTimeout(r, 380));
            const extracted_params = extrairParametrosFallback(consulta);
            const cache_key = JSON.stringify(extracted_params);

            if (cacheMemoriaLocalRef.current[cache_key]) {
              setResultadoIA({
                query_original: consulta,
                extracted_params,
                cached: true,
                cache_key,
                results: cacheMemoriaLocalRef.current[cache_key],
              });
            } else {
              const mapaCat = {
                italiana: "Italiano",
                alemã: "Alemão",
                hamburgueria: "Hamburgueria",
                japonesa: "Japonês",
              };
              const catAlvo = mapaCat[extracted_params.cuisine];
              const parceirosCompativeis =
                extracted_params.location === "Brusque"
                  ? restaurantes
                      .filter(
                        (r) =>
                          !catAlvo ||
                          r.categoria.toLowerCase() === catAlvo.toLowerCase() ||
                          extracted_params.cuisine === "variada"
                      )
                      .map((r) => ({
                        name: r.nome,
                        rating: r.avaliacao,
                        formatted_address: `${r.endereco} - ${r.bairro}, Brusque - SC`,
                        price_level: extracted_params.price_level,
                        parceiro_id: r.id,
                        cupom_destaque: r.cupom_destaque,
                        desconto_percentual: r.desconto_percentual,
                      }))
                  : [];

              const cardsGooglePlaces = [
                ...parceirosCompativeis,
                {
                  name: `Reserva ${extracted_params.location} — Cozinha ${extracted_params.cuisine.toUpperCase()}`,
                  rating: 4.8,
                  formatted_address: `Av. Beira Rio, 540 - Centro, ${extracted_params.location} - SC`,
                  price_level: extracted_params.price_level,
                },
                {
                  name: `Bistrô & Osteria (${extracted_params.vibe})`,
                  rating: 4.7,
                  formatted_address: `Rua Hercílio Luz, 315 - Centro, ${extracted_params.location} - SC`,
                  price_level: extracted_params.price_level,
                },
              ];

              cacheMemoriaLocalRef.current[cache_key] = cardsGooglePlaces;
              setResultadoIA({
                query_original: consulta,
                extracted_params,
                cached: false,
                cache_key,
                results: cardsGooglePlaces,
              });
            }
          } finally {
            setCarregandoIA(false);
          }
        };

        const carregarDisponibilidadeHorarios = useCallback(
          async (restaurante, data, pessoas) => {
            if (!restaurante) return;
            setCarregandoSlots(true);
            try {
              if (usandoApiReal) {
                const res = await fetch(
                  `${API_BASE_URL}/restaurantes/${restaurante.id}/disponibilidade?data_reserva=${data}&qtd_pessoas=${pessoas}`
                );
                if (res.ok) {
                  const slots = await res.json();
                  setSlotsDisponibilidade(slots);
                  const atualDisponivel = slots.find(
                    (s) => s.hora === horarioReserva && s.disponivel
                  );
                  if (!atualDisponivel) {
                    const primeiroLivre = slots.find((s) => s.disponivel);
                    if (primeiroLivre) setHorarioReserva(primeiroLivre.hora);
                  }
                  return;
                }
              }

              const listaMesas = (mesasDemo[restaurante.id] || []).filter(
                (m) => m.ativa && m.capacidade >= Number(pessoas)
              );
              const reservasAtivas = minhasReservas.filter(
                (r) =>
                  r.restaurante_id === restaurante.id &&
                  r.data_reserva === data &&
                  (r.status === "CONFIRMADA" || r.status === "PENDENTE")
              );

              const slotsCalculados = HORARIOS_BASE.map((slot) => {
                const ocupadasNoHorario = reservasAtivas.filter(
                  (r) => r.horario_reserva.slice(0, 5) === slot.hora
                ).length;
                const livres = Math.max(0, listaMesas.length - ocupadasNoHorario);
                const temCupom =
                  slot.ocioso &&
                  restaurante.desconto_percentual > 0 &&
                  Boolean(restaurante.cupom_destaque);
                return {
                  hora: slot.hora,
                  ocioso: slot.ocioso,
                  bonus: slot.bonus,
                  disponivel: livres > 0,
                  mesas_livres: livres,
                  desconto_aplicavel: temCupom ? restaurante.desconto_percentual : 0,
                  cupom_aplicavel: temCupom ? restaurante.cupom_destaque : null,
                };
              });
              setSlotsDisponibilidade(slotsCalculados);
            } finally {
              setCarregandoSlots(false);
            }
          },
          [usandoApiReal, mesasDemo, minhasReservas, horarioReserva]
        );

        useEffect(() => {
          if (restauranteSelecionado && !reservaConfirmada) {
            carregarDisponibilidadeHorarios(
              restauranteSelecionado,
              dataReserva,
              qtdPessoas
            );
          }
        }, [
          restauranteSelecionado,
          dataReserva,
          qtdPessoas,
          reservaConfirmada,
          carregarDisponibilidadeHorarios,
        ]);

        const carregarDadosPainelRestaurante = useCallback(async () => {
          const restAtual = restaurantes.find(
            (r) => r.id === Number(restauranteParceiroId)
          );
          if (restAtual) {
            setCupomTextoEdit(restAtual.cupom_destaque || "");
            setCupomDescontoEdit(restAtual.desconto_percentual || 0);
          }

          if (usandoApiReal) {
            try {
              const [resReservas, resMesas] = await Promise.all([
                fetch(
                  `${API_BASE_URL}/restaurantes/${restauranteParceiroId}/reservas?data_reserva=${dataFiltroPainel}`
                ),
                fetch(`${API_BASE_URL}/restaurantes/${restauranteParceiroId}/mesas`),
              ]);
              if (resReservas.ok) setReservasPainel(await resReservas.json());
              if (resMesas.ok) setMesasPainel(await resMesas.json());
              return;
            } catch {}
          }

          const filtradas = minhasReservas.filter(
            (r) =>
              Number(r.restaurante_id) === Number(restauranteParceiroId) &&
              (!dataFiltroPainel || r.data_reserva === dataFiltroPainel)
          );
          setReservasPainel(filtradas);
          setMesasPainel(mesasDemo[restauranteParceiroId] || []);
        }, [
          restauranteParceiroId,
          dataFiltroPainel,
          usandoApiReal,
          minhasReservas,
          mesasDemo,
          restaurantes,
        ]);

        useEffect(() => {
          if (abaPrincipal === "restaurante") {
            carregarDadosPainelRestaurante();
          }
        }, [abaPrincipal, carregarDadosPainelRestaurante]);

        const categorias = ["Todos", "Alemão", "Italiano", "Hamburgueria", "Japonês"];

        const restaurantesFiltrados = restaurantes.filter((r) => {
          const matchCategoria =
            categoriaAtiva === "Todos" || r.categoria === categoriaAtiva;
          const matchBusca =
            !busca.trim() ||
            resultadoIA !== null ||
            r.nome.toLowerCase().includes(busca.toLowerCase()) ||
            r.bairro.toLowerCase().includes(busca.toLowerCase()) ||
            r.categoria.toLowerCase().includes(busca.toLowerCase());
          return matchCategoria && matchBusca;
        });

        const slotSelecionadoInfo =
          slotsDisponibilidade.find((s) => s.hora === horarioReserva) || {
            hora: horarioReserva,
            ocioso: horarioReserva <= "19:30",
            disponivel: true,
            mesas_livres: 2,
          };

        const abrirFluxoReserva = (restaurante) => {
          setRestauranteSelecionado(restaurante);
          setReservaConfirmada(null);
          setErroReserva(null);
        };

        const fecharModal = () => {
          setRestauranteSelecionado(null);
          setReservaConfirmada(null);
          setErroReserva(null);
        };

        const confirmarReserva = async (e) => {
          e.preventDefault();
          setCarregandoReserva(true);
          setErroReserva(null);

          const payload = {
            restaurante_id: restauranteSelecionado.id,
            data_reserva: dataReserva,
            horario_reserva: `${horarioReserva}:00`,
            qtd_pessoas: Number(qtdPessoas),
            nome_usuario: nomeUsuario,
            email_usuario: emailUsuario,
            telefone_usuario: telefoneUsuario,
          };

          try {
            if (usandoApiReal) {
              const response = await fetch(`${API_BASE_URL}/reservas`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });

              if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.detail || "Erro ao realizar reserva.");
              }

              const confirmacao = await response.json();
              setReservaConfirmada(confirmacao);
              setMinhasReservas((prev) => [
                confirmacao,
                ...prev.filter(
                  (item) =>
                    item.codigo_confirmacao !== confirmacao.codigo_confirmacao
                ),
              ]);
            } else {
              if (!slotSelecionadoInfo.disponivel) {
                throw new Error(
                  "Não há mesas disponíveis para essa quantidade de pessoas neste horário."
                );
              }

              await new Promise((r) => setTimeout(r, 450));
              const listaMesasCompativeis = (
                mesasDemo[restauranteSelecionado.id] || []
              ).filter((m) => m.ativa && m.capacidade >= Number(qtdPessoas));

              const mesaEscolhida = listaMesasCompativeis[0] || {
                identificador: "Mesa 01",
              };
              const horarioEhOcioso = horarioReserva <= "19:30";
              const cupomAplicado =
                horarioEhOcioso && restauranteSelecionado.desconto_percentual > 0
                  ? restauranteSelecionado.cupom_destaque
                  : null;

              const confirmacaoSimulada = {
                id: Date.now(),
                codigo_confirmacao: `BRQ-${Math.random()
                  .toString(36)
                  .substring(2, 8)
                  .toUpperCase()}`,
                restaurante_id: restauranteSelecionado.id,
                restaurante_nome: restauranteSelecionado.nome,
                restaurante_endereco: restauranteSelecionado.endereco,
                restaurante_bairro: restauranteSelecionado.bairro,
                mesa_identificador: mesaEscolhida.identificador,
                data_reserva: dataReserva,
                horario_reserva: horarioReserva,
                qtd_pessoas: Number(qtdPessoas),
                cupom_aplicado: cupomAplicado,
                status: "CONFIRMADA",
                nome_usuario: nomeUsuario,
                email_usuario: emailUsuario,
                telefone_usuario: telefoneUsuario,
              };
              setReservaConfirmada(confirmacaoSimulada);
              setMinhasReservas((prev) => [confirmacaoSimulada, ...prev]);

            setErroReserva(err.message);

                { method: "PATCH" }
              );
              if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || "Não foi possível cancelar.");
              }
              const atualizada = await res.json();
              setMinhasReservas((prev) =>
                prev.map((r) =>
                  r.codigo_confirmacao === codigo ? atualizada : r
                )
              );
              if (voucherDetalhe?.codigo_confirmacao === codigo) {
                setVoucherDetalhe(atualizada);
              }
            } else {
              setMinhasReservas((prev) =>
                prev.map((r) =>
                  r.codigo_confirmacao === codigo
                    ? { ...r, status: "CANCELADA" }
                    : r
                )
              );
              if (voucherDetalhe?.codigo_confirmacao === codigo) {
                setVoucherDetalhe((prev) => ({ ...prev, status: "CANCELADA" }));

          try {
            if (usandoApiReal) {
              const res = await fetch(
                `${API_BASE_URL}/reservas/${codigo}/checkin`,
                { method: "PATCH" }
              );
              if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || "Erro ao validar voucher.");
              }
              const concluida = await res.json();
              setMinhasReservas((prev) =>

                  r.codigo_confirmacao === codigo ? concluida : r

              );

              const alvo = minhasReservas.find(

                throw new Error("Este voucher foi cancelado.");
              if (alvo.status === "CONCLUIDA")

              setMinhasReservas((prev) =>
                prev.map((r) =>

                    : r

                texto: `Check-in confirmado! Cliente: ${alvo.nome_usuario} (${alvo.mesa_identificador}).`,

                            {carregandoSlots && (
                              <span className="text-[11px] text-slate-400">
                                Consultando mesas...
                              </span>
                            )}
                          </div>

                          <div className="grid grid-cols-3 gap-2">
                            {slotsDisponibilidade.map((item) => {
                              const ativo = horarioReserva === item.hora;
                              const esgotado = !item.disponivel;
                              return (
                                <button
                                  type="button"
                                  key={item.hora}
                                  disabled={esgotado}
                                  onClick={() => setHorarioReserva(item.hora)}
                                  className={`p-2 rounded-xl border text-center transition ${
                                    esgotado
                                      ? "bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed opacity-60"
                                      : ativo
                                      ? "bg-orange-600 text-white border-orange-600 shadow-sm"
                                      : "bg-white text-slate-700 border-slate-200 hover:border-orange-300"
                                  }`}
                                >
                                  <div className="text-xs font-extrabold">
                                    {item.hora}
                                  </div>
                                  {esgotado ? (
                                    <div className="text-[10px] font-bold text-rose-500">
                                      Lotado
                                    </div>
                                  ) : item.ocioso &&
                                    restauranteSelecionado.desconto_percentual >
                                      0 ? (
                                    <div
                                      className={`text-[10px] font-bold ${
                                        ativo
                                          ? "text-orange-100"
                                          : "text-emerald-600"
                                      }`}
                                    >
                                      -
                                      {
                                        restauranteSelecionado.desconto_percentual
                                      }
                                      % OFF
                                    </div>
                                  ) : (
                                    <div
                                      className={`text-[10px] ${
                                        ativo
                                          ? "text-orange-100"
                                          : "text-slate-400"
                                      }`}
                                    >
                                      {item.mesas_livres}{" "}
                                      {item.mesas_livres === 1
                                        ? "mesa"
                                        : "mesas"}
                                    </div>
                                  )}
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div className="space-y-2.5 pt-2 border-t border-slate-100">
                          <p className="text-xs font-bold text-slate-700">
                            Seus dados para gerar o voucher
                          </p>
                          <input
                            type="text"
                            required
                            placeholder="Seu nome completo"
                            value={nomeUsuario}
                            onChange={(e) => setNomeUsuario(e.target.value)}
                            className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-orange-500"
                          />
                          <div className="grid grid-cols-2 gap-2">
                            <input
                              type="email"
                              required
                              placeholder="seu@email.com"
                              value={emailUsuario}
                              onChange={(e) => setEmailUsuario(e.target.value)}
                              className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-orange-500"
                            />
                            <input
                              type="tel"
                              required
                              placeholder="(47) 99999-0000"
                              value={telefoneUsuario}
                              onChange={(e) =>
                                setTelefoneUsuario(e.target.value)
                              }
                              className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-orange-500"
                            />
                          </div>
                        </div>

                        {erroReserva && (
                          <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold p-3 rounded-xl">
                            {erroReserva}
                          </div>
                        )}

                        <button
                          type="submit"
                          disabled={
                            carregandoReserva || !slotSelecionadoInfo.disponivel
                          }
                          className="w-full bg-gradient-to-r from-orange-600 to-rose-600 text-white font-extrabold text-sm py-3 rounded-2xl shadow-lg hover:opacity-95 disabled:opacity-50"
                        >
                          {carregandoReserva
                            ? "Alocando sua mesa..."
                            : slotSelecionadoInfo.ocioso &&
                              restauranteSelecionado.desconto_percentual > 0
                            ? "Confirmar Reserva + Garantir Cupom"
                            : "Confirmar Reserva de Mesa"}
                        </button>
                      </form>
                    ) : (
                      <div className="mt-5 text-center space-y-4">
                        <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-2xl">
                          ✅
                        </div>

                        <div>
                          <h4 className="text-lg font-extrabold text-slate-900">
                            Mesa Reservada com Sucesso!
                          </h4>
                          <p className="text-xs text-slate-500 mt-0.5">
                            Apresente o QR Code ou código na recepção do
                            restaurante.
                          </p>
                        </div>

                        <div className="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-4 text-left space-y-3">
                          <div className="flex justify-between items-center">
                            <div>
                              <span className="text-[10px] font-bold text-slate-400 uppercase block">
                                Código do Voucher
                              </span>
                              <span className="text-base font-mono font-extrabold bg-slate-900 text-white px-3 py-1 rounded-lg inline-block mt-0.5">
                                {reservaConfirmada.codigo_confirmacao}
                              </span>
                            </div>
                            <img
                              src={`https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(
                                reservaConfirmada.codigo_confirmacao
                              )}`}
                              alt="QR Code Voucher"
                              className="w-16 h-16 rounded-lg border border-slate-200 bg-white p-1"
                            />
                          </div>

                          <div className="text-xs text-slate-700 space-y-1 pt-2 border-t border-slate-200">
                            <p>
                              <strong>Restaurante:</strong>{" "}
                              {reservaConfirmada.restaurante_nome}
                            </p>
                            <p>
                              <strong>Mesa Alocada:</strong>{" "}
                              {reservaConfirmada.mesa_identificador}
                            </p>
                            <p>
                              <strong>Data e Hora:</strong>{" "}
                              {reservaConfirmada.data_reserva} às{" "}
                              {reservaConfirmada.horario_reserva.slice(0, 5)}
                            </p>
                            <p>
                              <strong>Pessoas:</strong>{" "}
                              {reservaConfirmada.qtd_pessoas} lugares
                            </p>
                            {reservaConfirmada.cupom_aplicado ? (
                              <p className="text-emerald-700 font-bold pt-1">
                                🎁 Cupom ativo:{" "}
                                {reservaConfirmada.cupom_aplicado}
                              </p>
                            ) : (
                              <p className="text-slate-500 pt-1">
                                ℹ️ Reserva em horário normal (sem desconto
                                ocioso)
                              </p>
                            )}
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <a
                            href={gerarLinkWhatsAppVoucher(reservaConfirmada)}
                            target="_blank"
                            rel="noreferrer"
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 px-3 rounded-xl text-center"
                          >
                            💬 Salvar no WhatsApp
                          </a>

                          <a
                            href={gerarLinkGoogleMaps(
                              reservaConfirmada.restaurante_endereco ||
                                restauranteSelecionado.endereco,
                              reservaConfirmada.restaurante_bairro ||
                                restauranteSelecionado.bairro
                            )}
                            target="_blank"
                            rel="noreferrer"
                            className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs py-2.5 px-3 rounded-xl text-center"
                          >
                            📍 Ver no Mapa
                          </a>
                        </div>

                        <button
                          onClick={fecharModal}
                          className="w-full bg-slate-900 text-white font-bold text-xs py-3 rounded-xl"
                        >
                          Concluir e Voltar
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* MODAL DE DETALHE DO VOUCHER */}
              {voucherDetalhe && (
                <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
                  <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4 text-center">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-extrabold uppercase text-orange-600">
                        Voucher Digital MesaBrusque
                      </span>
                      <button
                        onClick={() => setVoucherDetalhe(null)}
                        className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-bold"
                      >
                        ✕
                      </button>
                    </div>

                    <img
                      src={`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(
                        voucherDetalhe.codigo_confirmacao
                      )}`}
                      alt="QR Code"
                      className="w-36 h-36 mx-auto rounded-2xl border border-slate-200 p-2 bg-white shadow-sm"
                    />

                    <div>
                      <span className="font-mono text-lg font-extrabold bg-slate-900 text-white px-4 py-1.5 rounded-xl inline-block">
                        {voucherDetalhe.codigo_confirmacao}
                      </span>
                      <p className="text-sm font-extrabold text-slate-900 mt-2">
                        {voucherDetalhe.restaurante_nome}
                      </p>
                      <p className="text-xs text-slate-500">
                        {voucherDetalhe.data_reserva} às{" "}
                        {voucherDetalhe.horario_reserva.slice(0, 5)} •{" "}
                        {voucherDetalhe.mesa_identificador} (
                        {voucherDetalhe.qtd_pessoas}p)
                      </p>
                    </div>

                    {voucherDetalhe.cupom_aplicado && (
                      <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 text-xs font-bold text-emerald-800">
                        🎁 {voucherDetalhe.cupom_aplicado}
                      </div>
                    )}

                    <button
                      onClick={() => setVoucherDetalhe(null)}
                      className="w-full bg-slate-900 text-white font-bold text-xs py-2.5 rounded-xl"
                    >
                      Fechar
                    </button>
                  </div>
                </div>
              )}

              {/* BARRA DE NAVEGAÇÃO INFERIOR */}
              <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2 flex items-center justify-around z-40">
                <button
                  onClick={() => setAbaPrincipal("explorar")}
                  className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition ${
                    abaPrincipal === "explorar"
                      ? "text-orange-600 font-extrabold"
                      : "text-slate-400 hover:text-slate-600 font-semibold"
                  }`}
                >
                  <span className="text-base">📍</span>
                  <span className="text-[11px]">Explorar + IA</span>
                </button>

                <button
                  onClick={() => setAbaPrincipal("reservas")}
                  className={`relative flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition ${
                    abaPrincipal === "reservas"
                      ? "text-orange-600 font-extrabold"
                      : "text-slate-400 hover:text-slate-600 font-semibold"
                  }`}
                >
                  <span className="text-base">🎟️</span>
                  <span className="text-[11px]">Meus Vouchers</span>
                  {reservasAtivasCount > 0 && (
                    <span className="absolute top-0.5 right-2 bg-emerald-600 text-white text-[9px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">
                      {reservasAtivasCount}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setAbaPrincipal("restaurante")}
                  className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition ${
                    abaPrincipal === "restaurante"
                      ? "text-orange-600 font-extrabold"
                      : "text-slate-400 hover:text-slate-600 font-semibold"
                  }`}
                >
                  <span className="text-base">🏪</span>
                  <span className="text-[11px]">Painel Parceiro</span>
                </button>
              </nav>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
